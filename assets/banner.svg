<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
        50% { opacity: 0.65; transform: scale(1.08) translate(15px, -10px); }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-40px) translateX(-20px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .glow-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 250px;
      }
      .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 8s ease-in-out infinite; }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 12s linear infinite;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#tech-grid)" />

  <!-- Animated Ambient Lighting Orbs (Background layer) -->
  <g>
    <circle cx="220" cy="110" r="140" fill="#38bdf8" opacity="0.25" filter="url(#blur-glow)" class="glow-orb-1" />
    <circle cx="980" cy="240" r="170" fill="#a855f7" opacity="0.2" filter="url(#blur-glow)" class="glow-orb-2" />
    <circle cx="600" cy="180" r="120" fill="#6366f1" opacity="0.15" filter="url(#blur-glow)" />
  </g>

  <!-- Flowing Dynamic Cyber Streams (Behind Text) -->
  <g stroke-linecap="round" fill="none" opacity="0.35">
    <path class="stream-line" d="M -50 90 Q 300 180 650 70 T 1250 120" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M -50 290 Q 400 160 800 280 T 1250 200" stroke="#c084fc" stroke-width="1.8" />
    <path class="stream-line" d="M 100 380 C 450 300 750 40 1150 160" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Floating Ambient Nodes -->
  <g>
    <circle class="particle-1" cx="160" cy="280" r="3" fill="#38bdf8" />
    <circle class="particle-2" cx="340" cy="70" r="2.5" fill="#818cf8" />
    <circle class="particle-1" cx="880" cy="80" r="3.5" fill="#c084fc" />
    <circle class="particle-2" cx="1060" cy="290" r="2" fill="#38bdf8" />
    <circle class="particle-1" cx="720" cy="310" r="3" fill="#06b6d4" />
  </g>

  <!-- Decorative Corner Tech Accents -->
  <g stroke="#475569" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 30 50 L 30 30 L 50 30" />
    <path d="M 1170 50 L 1170 30 L 1150 30" />
    <path d="M 30 310 L 30 330 L 50 330" />
    <path d="M 1170 310 L 1170 330 L 1150 330" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Typography & Pills (Always on top) -->

  <!-- Terminal Command Prompt Badge -->
  <g transform="translate(600, 72)">
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#badge-shadow)" />
    <circle cx="-150" cy="-1" r="5" fill="#ef4444" />
    <circle cx="-135" cy="-1" r="5" fill="#f59e0b" />
    <circle cx="-120" cy="-1" r="5" fill="#10b981" />
    <text x="-95" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#94a3b8">
      $ curl -sL <tspan fill="#38bdf8">cheat.sh</tspan>/cli-docs
    </text>
    <rect class="cursor" x="135" y="-8" width="2" height="14" fill="#38bdf8" />
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 160)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em" fill="url(#primary-glow)">
      Awesome CLI Documentation
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f8fafc" letter-spacing="-0.01em">
      &amp; Cheatsheets Ecosystem
    </text>
  </g>

  <!-- Micro Explainer -->
  <g transform="translate(600, 242)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.02em">
      Curated Modern Man Pages • Interactive Cheatsheets • Offline Doc Browsers • AI Terminal Companions
    </text>
  </g>

  <!-- Feature Tags / Pills Row -->
  <g transform="translate(600, 296)">
    <!-- Pill 1: TLDR & Man Pages -->
    <g transform="translate(-320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">⚡ tldr-pages</text>
    </g>

    <!-- Pill 2: cheat.sh -->
    <g transform="translate(-160, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
      <text y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">🔍 cheat.sh</text>
    </g>

    <!-- Pill 3: Offline Browsers -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
      <text y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">📚 Offline Docs</text>
    </g>

    <!-- Pill 4: Interactive Discovery -->
    <g transform="translate(160, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">🎯 navi / fzf</text>
    </g>

    <!-- Pill 5: AI Terminals -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" />
      <text y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">🤖 AI Terminals</text>
    </g>
  </g>
</svg>
